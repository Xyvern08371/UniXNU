name: macOS build

on:
  workflow_dispatch:
    inputs:
      device_repository:
        description: Device repository as owner/name
        required: true
        default: UniXNU/UniXNU-sheng
      device_ref:
        description: Device repository ref
        required: true
        default: main
      defconfig:
        description: Defconfig name
        required: true
        default: sheng_defconfig
      steps:
        description: Steps to run
        type: choice
        options:
          - kernel
          - kernel payload
          - kernel userdata
          - kernel userdata payload
        default: kernel userdata
      ipsw_url:
        description: IPSW URL (empty uses board.toml)
        required: false
        default: ""
      unique_chip_id:
        description: 8-byte platform seed hex (overrides the UNIXNU_UNIQUE_CHIP_ID secret)
        required: false
        default: ""
      trust_cache_url:
        description: Trust cache bundle URL (optional)
        required: false
        default: ""
      owner_trust_cache:
        description: Treat the trust cache URL as an owner-signed bundle
        type: boolean
        default: false
      data_seed_url:
        description: Data seed URL (optional)
        required: false
        default: ""
      grow_gib:
        description: Grow the Data seed to this many GiB (optional)
        required: false
        default: ""
      skip_setup:
        description: Mark Setup as done in the Data seed
        type: boolean
        default: false
      upload_userdata:
        description: Upload the userdata image (large)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device
          submodules: recursive
          token: ${{ secrets.UNIXNU_DEVICE_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install host tools
        run: |
          brew install cmake ninja unifdef llvm mtools dtc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Select the device
        run: |
          ./unixnu defconfig "${{ inputs.defconfig }}" -D "$GITHUB_WORKSPACE/device"
          ./unixnu fetch

      - name: Prepare inputs
        env:
          TRUST_CACHE_URL: ${{ inputs.trust_cache_url }}
          DATA_SEED_URL: ${{ inputs.data_seed_url }}
          GROW_GIB: ${{ inputs.grow_gib }}
          SKIP_SETUP: ${{ inputs.skip_setup }}
        run: |
          if [ -n "$TRUST_CACHE_URL" ]; then
            curl -fL "$TRUST_CACHE_URL" -o "$RUNNER_TEMP/trustcache"
          fi
          if [ -n "$DATA_SEED_URL" ]; then
            curl -fL "$DATA_SEED_URL" -o "$RUNNER_TEMP/data.dbr"
            if [ -n "$GROW_GIB" ]; then
              python3 scripts/seed-data-grow.py --gib "$GROW_GIB" "$RUNNER_TEMP/data.dbr" "$RUNNER_TEMP/data-grow.dbr"
              mv "$RUNNER_TEMP/data-grow.dbr" "$RUNNER_TEMP/data.dbr"
            fi
          elif [ -n "$GROW_GIB" ]; then
            echo "grow_gib needs data_seed_url" >&2
            exit 1
          fi
          if [ "$SKIP_SETUP" = "true" ] && [ ! -f "$RUNNER_TEMP/data.dbr" ]; then
            echo "skip_setup needs data_seed_url" >&2
            exit 1
          fi

      - name: Prepare storage ABI headers
        run: |
          ./unixnu tree
          cd out/fuxi/tree
          if [ ! -d refer/IOStorageFamily/.git ]; then
            git clone --depth 1 https://github.com/apple-oss-distributions/IOStorageFamily.git refer/IOStorageFamily
          fi
          mkdir -p build/storage-abi/include/IOKit/storage
          cp refer/IOStorageFamily/*.h build/storage-abi/include/IOKit/storage/
          cp "$(xcrun --sdk macosx --show-sdk-path)/usr/include/TargetConditionals.h" build/storage-abi/include/TargetConditionals.h
          echo "--- 99-fuxi patch in tree? ---"
          ls out/fuxi/tree/patches/xnu/ 2>/dev/null | grep "99-fuxi" || echo "NO 99-fuxi patch in tree"
          echo "--- MakeInc.def location ---"
          MK=$(find out/fuxi/tree -name MakeInc.def -path "*makedefs*" 2>/dev/null | head -1)
          echo "MakeInc.def: ${MK:-not found}"
          grep -n "CXXFLAGS_GEN" "$MK" 2>/dev/null | head -2
          if [ -n "$MK" ]; then
            sed -i '' 's|-fapple-kext $(OTHER_CXXFLAGS)|-fapple-kext -DKERNEL $(OTHER_CXXFLAGS)|' "$MK"
            echo "--- CXXFLAGS_GEN after sed ---"
            grep -n "CXXFLAGS_GEN" "$MK" | head -2
          fi

      - name: Build kernel
        env:
          JOBS: "1"
          IPSW_URL: ${{ inputs.ipsw_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd out/fuxi/tree
          # 1) ensure pinned XNU source + work tree
          if [ ! -d refer/xnu/.git ]; then
            git clone --depth 1 --branch xnu-10063.141.1 https://github.com/apple-oss-distributions/xnu.git refer/xnu
          fi
          git -C refer/xnu fetch --depth 1 origin d8b80295118ef25ac3a784134bcf95cd8e88109f 2>/dev/null && git -C refer/xnu checkout --detach FETCH_HEAD 2>/dev/null || true
          echo "refer/xnu HEAD=$(git -C refer/xnu rev-parse HEAD)"
          if [ ! -d .cache/xnu-work/.git ]; then
            git clone --shared refer/xnu .cache/xnu-work
          fi
          # 2) build availability.pl into every SDK
          if [ ! -x .cache/fakeroot/usr/local/libexec/availability.pl ]; then
            if [ ! -d refer/AvailabilityVersions/.git ]; then
              git clone --depth 1 --branch AvailabilityVersions-141.1 https://github.com/apple-oss-distributions/AvailabilityVersions.git refer/AvailabilityVersions
            fi
            mkdir -p .cache/fakeroot build/availability
            make -C refer/AvailabilityVersions install -j1 \
              OBJROOT="$PWD/build/availability" SYMROOT="$PWD/build/availability" \
              DSTROOT="$PWD/.cache/fakeroot" CMAKE="$(command -v cmake)" NINJA="$(command -v ninja)" >/dev/null 2>&1
          fi
          if [ -x .cache/fakeroot/usr/local/libexec/availability.pl ]; then
            for D in "/Applications/Xcode_15.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs" "/Library/Developer/CommandLineTools/SDKs"; do
              for SDK in "$D"/*.sdk; do
                [ -d "$SDK" ] || continue
                mkdir -p "$SDK/usr/local/libexec"
                cp .cache/fakeroot/usr/local/libexec/availability.pl "$SDK/usr/local/libexec/availability.pl"
                chmod +x "$SDK/usr/local/libexec/availability.pl"
                echo "availability.pl -> $SDK"
              done
            done
          else
            echo "WARN: availability.pl build failed"
          fi
          # 3) force -DKERNEL into CXXFLAGS_GEN
          sed -i '' 's|-fapple-kext $(OTHER_CXXFLAGS)|-fapple-kext -DKERNEL $(OTHER_CXXFLAGS)|' .cache/xnu-work/makedefs/MakeInc.def
          echo "--- CXXFLAGS_GEN after sed ---"
          grep -n "CXXFLAGS_GEN" .cache/xnu-work/makedefs/MakeInc.def | head -2
          cd "$GITHUB_WORKSPACE"
          args=()
          if [ -n "$IPSW_URL" ]; then args+=(--ipsw "$IPSW_URL"); fi
          ./unixnu build kernel "${args[@]}"
